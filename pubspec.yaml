# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - asset/exception_error/
     - lib/core/data/db/queries/
     - asset/icons/discover.png
     - asset/daily_tracker/pre_checkin_background1.png
     - asset/daily_tracker/pre_checkin_potrait.png
     - asset/daily_tracker/
     - asset/sound_effects/
     - asset/daily_tracker/auth/

     - asset/default_dash_flavor/leading_logo.png
     - asset/dart_flavor/dart_leading_logo.png
     - asset/flutter_flavor/flutter_leading_logo.png

     # Loading assets based on the flavors expect for Web, currently it is not supporting web
     - path: asset/dart_flavor/flavor_splash/
       flavors:
        - dart
     - path: asset/flutter_flavor/flavor_splash/
       flavors:
        - flutter
     - path: asset/default_dash_flavor/flavor_splash/
       flavors:
        - dash      
     - path: asset/default_dash_flavor/flavor_splash_web/
       platforms:
        - web

     # Loading splash screen images based on the platform
     - path: asset/splash_screens/web/
       platforms:
        - web
     - path: asset/splash_screens/android/
       platforms:
        - android
     - path: asset/splash_screens/ios/
       platforms:
        - ios
     - path: asset/splash_screens/linux/
       platforms:
        - linux   
     - path: asset/splash_screens/windows/
       platforms:
        - windows
     - path: asset/splash_screens/mac/
       platforms:
        - mac   

    # Loading Offline assets based on the platform      
     - path: asset/school_data.zip
       platforms:
        - macos
        - ios
        - android
     - path: asset/gifs/waiting.gif
       platforms:
        - macos
        - ios
        - android
     - path: asset/gifs/happy.gif
       platforms:
        - macos
        - ios
        - android
