name: sample_latest
description: Assist Flutter developers in constructing
  their applications in Multi-Platform.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.6.0

workspace:
  - features/schools
  - features/feature_localization
  - features/routing_feature
  - features/scrolling
  - features/regular_widgets
  - features/shortcuts_feature
  - features/deep_linking_feature
  - features/responsive_showcase
  - features/feature_discovery_module
  - features/push_notifications
  - features/isolates_feature
  - features/smart_control_iot
  - features/smart_control_mqtt

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Flutter launcher icons
  flutter_launcher_icons: ^0.13.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  go_router: ^15.1.0
#  workmanager: ^0.5.2
#  easy_upi_payment:
  google_fonts: ^6.1.0
  connectivity_plus: 6.1.4
  sqflite:
  provider:
  flutter_bloc:
  equatable:
  path_provider: ^2.1.2
  path:
  loader_overlay: ^4.0.0

  # Plugins
  youtube_player_flutter: ^9.1.1
  local_auth:
#  share_plus:
#  video_player:
  network_info_plus:
  just_audio:
  fluttertoast: ^8.2.12
  dio:
  uuid:
  cached_network_image: 3.3.1
  rxdart: ^0.27.7
  shared_preferences: ^2.5.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.2
  firebase_crashlytics: ^4.3.2
  firebase_remote_config: ^5.3.2
  firebase_auth: ^5.5.2
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^17.1.2
  json_annotation:
  archive: ^4.0.7
  liquid_progress_indicator_v2: ^0.5.0
  feature_discovery:
    git:
      url: https://github.com/maheshmnj/feature_discovery.git
      ref: master
  url_launcher: ^6.2.6
  googleapis_auth: ^1.6.0
  bloc_test: ^9.1.7

  google_generative_ai:
  image_picker: ^1.1.2
  flutter_chat_ui:
  firebase_database: ^11.3.5
  simple_ripple_animation: ^0.0.9
  one_clock: ^2.0.1
  stop_watch_timer: ^3.1.1
  shimmer: ^3.0.0
  get_it: ^8.0.3
  fpdart: ^1.1.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter_staggered_grid_view: ^0.7.0
  mqtt_client:
  win32: ^5.10.1
  dart_periphery: ^0.9.18
  flutter_lite_camera: ^0.0.2
  flutter_gen: ^5.9.0
  flutter_secure_storage: ^9.2.2
  schools:
    path: features/schools
  feature_localization:
    path: features/feature_localization
  routing_feature:
    path: features/routing_feature
  scrolling:
    path: features/scrolling
  regular_widgets:
    path: features/regular_widgets
  shortcuts_feature:
    path: features/shortcuts_feature
  deep_linking_feature:
    path: features/deep_linking_feature
