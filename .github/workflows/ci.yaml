name: Flutter End to End

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  check_version:
    uses: ./.github/workflows/check-version.yml
    with:
      base_ref: ${{ github.base_ref }}  # passes 'develop' or 'main' depending on PR target

  lint_and_test:
    runs-on: ubuntu-latest
    needs: check_version
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.38.7'

      - name: Get pub dependencies
        run: flutter pub get

      - name: Check code format
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run schools package tests
        run: flutter test
        working-directory: features/schools

  build_android:
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v1
        with:
          flutter-version: '3.38.7'

      - name: Get pub dependencies
        run: flutter pub get

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        run: flutter build apk --flavor flutter --no-tree-shake-icons

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/app-flutter-release.apk

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/app/outputs/flutter-apk/
          publish_branch: gh-pages

  build_web:
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web

  build_ios:
    runs-on: macos-latest
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --no-codesign --no-tree-shake-icons

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ios
          path: build/ios/archive/Runner.xcarchive

  build_pi:
    runs-on: ubuntu-latest
    needs: lint_and_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Install flutterpi_tool
        run: dart pub global activate flutterpi_tool

      - name: Build for Raspberry Pi
        run: flutterpi_tool build --arch=arm64 --release

      - name: Upload Pi build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-pi-arm64
          path: build/flutter_assets
